# Strictly free Render demo. The free Postgres database expires after 30 days.
services:
  - type: web
    name: dak-insurance-demo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ROLE
        value: web
      - key: RUN_INLINE_WORKER
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: dak-insurance-demo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: dak-insurance-demo-queue
          property: connectionString
      - key: CLOUDMAILIN_SECRET
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTO_SEND_ENABLED
        value: "false"
      - key: ALLOW_UNSIGNED_WEBHOOK
        value: "false"
      - key: CORPUS_VERSION
        value: "1"

  - type: keyvalue
    name: dak-insurance-demo-queue
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: dak-insurance-demo-db
    databaseName: dak_demo
    user: dak_demo
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
